<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACTURA</title>
    <script src="factura.js" defer></script>
</head>
<body>
    <div class="container-xs bg-warning" style="background-color: #e6ff02">
        <h2>FACTURA LICO 5TOA</h2>
        <div class="bg-primary" style="background-color: #6466cf">
            <form id="formularioFactura">
                <section aria-labelledby="datos-cliente">                    
                    <label for="nombrecliente">Cliente</label>
                    <input type="text" id="nombrecliente" name="nombrecliente" >

                    <label for="cedulacliente">Cédula</label>
                    <input type="text" id="cedulacliente" name="cedulacliente" >

                    <label for="sexocliente">Sexo</label>
                    <input type="text" id="sexocliente" name="sexocliente">
                </section>

                <section aria-labelledby="agregar-productos">
                    <label for="productos">Producto</label>
                    <input type="text" id="productos" name="productos" required>

                    <label for="cantidad">Cantidad</label>
                    <input type="number" id="cantidad" name="cantidad" min="0.01" step="any" required>

                    <label for="elprecio">Precio</label>
                    <input type="number" id="elprecio" name="elprecio" min="0" step="0.01" required>
                    <button type="submit" id="btnAgregarProducto">Agregar producto</button>
                </section>
            </form>

            <section aria-labelledby="detalle-factura">
                <h3 id="detalle-factura">Detalle de la factura</h3>
                <p id="datosClienteFactura" aria-live="polite">Completa los datos del cliente para la factura.</p>
                <table border="1">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio unitario</th>
                            <th>Subtotal</th>                           
                        </tr>
                    </thead>
                    <tbody id="listaProductos"></tbody>
                    <tfoot>
                        <tr>
                            <th colspan="3">Total Tabla</th>
                            <td id="totalFactura">0.00</td>
                        </tr>
                    </tfoot>
                </table>
            </section>
        </div>

        <div class="bg-secondary container-xs d-flex justify-content-end">
            <h4>Resumen de la factura</h4>
            <p><label>SubTotal: $</label><span id="resumenSubtotal">0.00</span></p>
            <p><label>IVA (15%): $</label><span id="resumenIva">0.00</span></p>
            <p><label>TOTAL: $</label><span id="resumenTotal">0.00</span></p>
        </div>
    </div>
</body>
</html>
